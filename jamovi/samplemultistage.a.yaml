---
name:  samplemultistage
title: "Two-stage sampling"
menuGroup: AnalisiMercato
menuSubgroup: "Sampling"
version: '2.0.9'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: psu_var
      title: "Primary sampling unit (PSU) variable"
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - id
        - numeric
      description:
          R: >
            Variabile che identifica le unità primarie (PSU = primary
            sampling units): tipicamente città, scuole, quartieri.
            Dal primo stadio vengono estratte casualmente n_g PSU.

    - name: id_var
      title: "ID variable (optional)"
      type: Variable
      suggested:
        - id
        - nominal
        - ordinal
      permitted:
        - factor
        - id
        - numeric
      description:
          R: >
            Variabile usata per identificare le unità di secondo stadio
            (SSU). Se specificata, la tabella "Unità estratte" mostra gli
            ID dei soggetti selezionati.

    - name: tuto
      title: "Show methodological description"
      type: Bool
      default: true

    # --- primo stadio ---
    - name: psu_mode
      title: "Number of PSUs"
      type: List
      options:
        - title: "Number of PSUs (n_g)"
          name:  ng
        - title: "PSU fraction (f_g)"
          name:  fg
      default: ng

    - name: ng
      title: "Number of PSUs to draw"
      type: Integer
      default: 3

    - name: fg
      title: "PSU fraction (f_g)"
      type: Number
      default: 0.3

    # --- secondo stadio ---
    - name: ssu_mode
      title: "Units per PSU"
      type: List
      options:
        - title: "Fixed number (b)"
          name:  fixed
        - title: "Fraction f_b of PSU"
          name:  frac
        - title: "All PSU units (= clusters)"
          name:  all
      default: fixed
      description:
          R: >
            Come allocare le unità di secondo stadio. 'fixed': estrae b
            unità da ciascuna PSU selezionata. 'frac': estrae una frazione
            f_b della numerosità di ciascuna PSU. 'all': prende tutte le
            unità delle PSU (equivalente al campionamento a grappoli).

    - name: b
      title: "Units per PSU (b)"
      type: Integer
      default: 5

    - name: fb
      title: "Unit fraction per PSU (f_b)"
      type: Number
      default: 0.5

    - name: seed
      title: "Seed (reproducibility)"
      type: Integer
      default: 1

    - name: out_freq
      title: "Draw the sample (0/1 indicator, frequency)"
      type: Output
      description:
          R: >
            Spuntare per iniettare nel dataset la colonna indicatrice del
            campione. Il nome della colonna sarà in_2STG.
...
