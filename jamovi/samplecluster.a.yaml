---
name:  samplecluster
title: "Cluster sampling"
menuGroup: AnalisiMercato
menuSubgroup: "Sampling"
version: '2.0.9'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: cluster_var
      title: "Cluster variable"
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - id
        - numeric
      description:
          R: >
            Variabile che identifica i grappoli (es. città, scuola, quartiere).
            Le unità all'interno di uno stesso grappolo dovrebbero essere
            tra loro eterogenee rispetto al fenomeno di interesse: il
            metodo è efficiente quando i grappoli sono "piccole popolazioni"
            simili tra loro.

    - name: id_var
      title: "ID variable (optional)"
      type: Variable
      suggested:
        - id
        - nominal
        - ordinal
      permitted:
        - factor
        - id
        - numeric
      description:
          R: >
            Variabile usata per identificare le singole unità nel dataset.
            Se specificata, la tabella "Unità estratte" mostra gli ID dei
            soggetti selezionati.

    - name: tuto
      title: "Show methodological description"
      type: Bool
      default: true

    - name: size_mode
      title: "Specification mode"
      type: List
      options:
        - title: "Number of clusters (n_g)"
          name:  ng
        - title: "Cluster fraction (f_g)"
          name:  fg
      default: ng
      description:
          R: >
            Indica se si specifica un numero assoluto di grappoli da
            estrarre o una frazione dei grappoli totali.

    - name: ng
      title: "Number of clusters to draw"
      type: Integer
      default: 3
      description:
          R: Numero di grappoli (cluster) da estrarre dalla popolazione.

    - name: fg
      title: "Cluster fraction (f_g)"
      type: Number
      default: 0.3
      description:
          R: Frazione f_g = n_g / M dei grappoli da estrarre.

    - name: seed
      title: "Seed (reproducibility)"
      type: Integer
      default: 1

    - name: out_freq
      title: "Draw the sample (0/1 indicator, frequency)"
      type: Output
      description:
          R: >
            Spuntare per iniettare nel dataset la colonna indicatrice del
            campione. Il nome della colonna sarà in_GR.
...
