title: Analisi delle Componenti Principali
name: pca
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    permitted:
      - factor
      - numeric
      - id
    children:
      - type: TargetLayoutBox
        label: Variabili attive (quantitative)
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Variabili quantitative supplementari (opzionali)
        children:
          - type: VariablesListBox
            name: supp_quant
            isTarget: true
      - type: TargetLayoutBox
        label: Variabile qualitativa supplementare per biplot (opzionale)
        children:
          - type: VariablesListBox
            name: supp_qual
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Variabili qualitative per la mappa di posizionamento (opzionali)
        children:
          - type: VariablesListBox
            name: supp_qual_map
            isTarget: true
      - type: TargetLayoutBox
        label: Variabile identificativa (opzionale)
        children:
          - type: VariablesListBox
            name: id_var
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: tuto
      - type: CheckBox
        name: standardize
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: ncp
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: rotation
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: show_ind
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: top_ind
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: axis_x
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: axis_y
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: plot_scree
      - type: CheckBox
        name: plot_circle
      - type: CheckBox
        name: plot_biplot
      - type: CheckBox
        name: plot_cos2
      - type: CheckBox
        name: plot_map
      - type: CheckBox
        name: map_show_active
      - type: CheckBox
        name: map_show_supp_quant
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: map_width
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: map_height
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: Output
        name: out_PC1
      - type: Output
        name: out_PC2
      - type: Output
        name: out_PC3
      - type: Output
        name: out_PC4
      - type: Output
        name: out_PC5
