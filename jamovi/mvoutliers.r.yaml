---
name: mvoutliers
title: "Multivariate outliers"
jrs: '1.1'

items:
  - name: instructions
    title: "Instructions"
    type: Html
    visible: (tuto)

  - name: riepilogo
    title: "Summary"
    type: Table
    rows: 1
    clearWith:
      - vars
      - alpha
    columns:
      - name: n
        title: "Observations used"
        type: integer
      - name: p
        title: "Variables"
        type: integer
      - name: soglia
        title: "Critical value of D²"
        type: number
      - name: nout
        title: "Outliers"
        type: integer
      - name: escluse
        title: "Rows with missing values"
        type: integer

  - name: outlier
    title: "Observations beyond the threshold"
    type: Table
    rows: 0
    clearWith:
      - vars
      - alpha
    columns:
      - name: riga
        title: "Row"
        type: integer
      - name: d2
        title: D²
        type: number
      - name: pval
        title: p
        type: number
        format: zto,pvalue

  - name: distOV
    title: "Mahalanobis distance"
    type: Output
    varTitle: mahal_D2
    varDescription: Distanza di Mahalanobis al quadrato dal centro dei dati
    measureType: continuous
    clearWith:
      - vars

  - name: outlierOV
    title: "Outliers"
    type: Output
    varTitle: outlier
    varDescription: 1 = outlier multivariato, 0 = altre osservazioni
    measureType: nominal
    clearWith:
      - vars
      - alpha
...
