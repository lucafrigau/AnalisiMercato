---
# La struttura dei risultati deriva dal modulo jamovi MEDA di Thomas Leblay,
# Fiona Tuffin, Maxime Saland, Maïwen Faure e Sébastien Lê, distribuito con
# licenza GPL (https://github.com/Sebastien-Le/MEDA). Adattata e modificata da
# Luca Frigau, 2026; distribuita con licenza GPL-3, come il resto del modulo.
name:  catdes
title: "Cluster profiling"
jrs:   '1.1'
refs:
    - factominer
    - explo
    - meda

items:
  - name: instructions
    title: "Instructions"
    visible: (tuto)
    type: Html
    
  - name: chigroup
    title: "Chi-square test"
    type: Group
    items:
      - name: chi
        title: "Association between 'Cluster' and categorical variables"
        type: Table
        columns:
          - name: varchi
            title: ''
            type: text
          - name: chipv
            title: p
            type: number
            format: zto,pvalue
          - name: df
            title: df
            type: integer

  - name: categgroup
    title: "Description via categorical variables"
    type: Group
    items:
      - name: categquali
        title: "Description of each 'Cluster' via categories"
        type: Table
        columns:
          - name: varcateg
            title: ''
            type: text
            combineBelow: true
          - name: vardesccateg
            title: "Category"
            type: text
          - name: clamod
            title: Cla/Mod
            type: number
          - name: modcla
            title: Mod/Cla
            type: number
          - name: global
            title: "Overall"
            type: number
          - name: categpv
            title: p
            type: number
            format: zto,pvalue
          - name: vtest
            title: "v-test"
            type: number
      - name: qualir2
        title: "Association with qualitative variables"
        type: Table
        columns:
          - name: varr2
            title: ''
            type: text
          - name: r2
            title: R²
            type: number
            format: zto
          - name: r2pvalue
            title: p
            type: number
            format: zto,pvalue      
      - name: categquanti
        title: "Description of the quantitative variable via categories"
        type: Table
        columns:
          - name: varcateg
            title: ''
            type: text
            combineBelow: true
          - name: vardesccateg
            title: "Category"
            type: text
          - name: estimate
            title: "Estimate"
            type: number
          - name: categpv
            title: p
            type: number
            format: zto,pvalue
      
  - name: qtvargroup
    title: "Overall description via quantitative variables"
    type: Group
    items:
      - name: qtvar
        title: "Relationship between 'Cluster' and quantitative variables"
        type: Table
        columns:
          - name: varqtvar
            title: ''
            type: text
          - name: scc
            title: "Squared correlation"
            type: number
          - name: qtvarpv
            title: p
            type: number
            format: zto,pvalue

  - name: qtgroup
    title: "Description via quantitative variables"
    type: Group
    items:
      - name: qt
        title: "Description of each 'Cluster' via quantitative variables"
        type: Table
        columns:
          - name: varqt
            title: ''
            type: text
          - name: vardescqt
            title: "Variable"
            type: text
          - name: vtestqt
            title: "v-test"
            type: number
          - name: meancateg
            title: "Mean in 'Cluster'"
            type: number
          - name: overallmean
            title: "Overall mean"
            type: number
          - name: sdcateg
            title: "SD in 'Cluster'"
            type: number
          - name: overallsd
            title: "Overall SD"
            type: number
          - name: qtpv
            title: p
            type: number
            format: zto,pvalue
      - name: qtcor
        title: "Relationship with quantitative variables"
        type: Table
        columns:
          - name: varcor
            title: ''
            type: text
          - name: cor
            title: "Correlation"
            type: number
          - name: corpvalue
            title: p
            type: number
            format: zto,pvalue
...
