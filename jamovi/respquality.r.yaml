---
name: respquality
title: "Response quality"
jrs: '1.1'

items:
  - name: instructions
    title: "Instructions"
    type: Html
    visible: (tuto)

  - name: riepilogo
    title: "Signals"
    type: Table
    rows: 0
    clearWith:
      - items
      - seqPerc
      - missPerc
      - pairs
      - distMin
    columns:
      - name: segnale
        title: "Signal"
        type: text
      - name: criterio
        title: "Criterion"
        type: text
      - name: n
        title: "Respondents"
        type: integer
      - name: perc
        title: "% of respondents"
        type: number
        format: pc

  - name: rispondenti
    title: "Respondents to examine"
    type: Table
    rows: 0
    clearWith:
      - items
      - seqPerc
      - missPerc
      - pairs
      - distMin
      - minSegnali
    columns:
      - name: riga
        title: "Row"
        type: integer
      - name: segnali
        title: "Signals"
        type: integer
      - name: seqmax
        title: "Same answer in a row"
        type: integer
      - name: mancanti
        title: "Missing"
        type: integer

  - name: matrici
    title: "Consistency matrices"
    type: Array
    items: (pairs)
    template:
      title: "Consistency matrix"
      type: Image
      width: 520
      height: 460
      renderFun: .plotMatrice
      clearWith:
        - pairs
        - distMin

  - name: segnaliOV
    title: "Number of signals"
    type: Output
    varTitle: segnali
    varDescription: Numero di segnali di poca attenzione del rispondente
    measureType: continuous
    clearWith:
      - items
      - seqPerc
      - missPerc
      - pairs
      - distMin

  - name: indicatoriOV
    title: "Indicators"
    type: Output
    initInRun: true
    measureType: continuous
    clearWith:
      - items
      - pairs
...
