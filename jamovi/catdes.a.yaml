---
name:  catdes
title: "Cluster profiling"
menuGroup: AnalisiMercato
menuSubgroup: Cluster Analysis
version: '2.0.9'
jas: '1.2'

options:
  - name: data
    type: Data

  - name: vartochar
    title: "'Cluster' variable to describe"
    type: Variable
    suggested:
      - nominal
      - ordinal
    permitted:
      - numeric
      - factor
    description:
        R: >
          Variabile categoriale (tipicamente l'assegnazione ai cluster) da
          caratterizzare. Se numerica viene usata condes; se factor viene
          usata catdes.

  - name: descbyvar
    title: "Descriptors"
    type: Variables
    suggested:
      - continuous
      - nominal
    permitted:
      - numeric
      - factor
    description:
        R: >
          Variabili (quantitative e/o qualitative) con cui descrivere la
          variabile target attraverso test statistici.

  - name: tuto
    title: "Show methodological description"
    type: Bool
    default: true
    description:
        R: Se TRUE mostra il pannello con la descrizione metodologica.

  - name: threshold
    title: "Significance threshold (%)"
    type: Number
    default: 5
    description:
        R: >
          Soglia di significatività in percentuale (default 5 = 0.05) per
          filtrare le variabili e le categorie riportate nei risultati.
...