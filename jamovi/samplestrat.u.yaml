title: Campionamento stratificato
name: samplestrat
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    permitted:
      - factor
      - numeric
      - id
    children:
      - type: TargetLayoutBox
        label: Variabili di stratificazione
        children:
          - type: VariablesListBox
            name: strat_var
            isTarget: true
      - type: TargetLayoutBox
        label: Variabile ausiliaria per allocazione ottimale (opzionale)
        children:
          - type: VariablesListBox
            name: aux_var
            maxItemCount: 1
            isTarget: true
            enable: (method:optimal)
      - type: TargetLayoutBox
        label: Variabile identificativa (opzionale)
        children:
          - type: VariablesListBox
            name: id_var
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: tuto
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: method
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: size_mode
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: 'n'
        format: number
        enable: (size_mode:n)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: f
        format: number
        enable: (size_mode:f)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: seed
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: Output
        name: out_freq
