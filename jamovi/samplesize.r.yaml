---
name:  samplesize
title: "Sample size"
jrs:   '1.1'

refs:
    - cochran
    - lohr

items:
    - name: instructions
      title: "Instructions"
      type: Html
      visible: (tuto)

    - name: inputs
      title: "Survey parameters"
      type: Table
      rows: 1
      clearWith:
        - param
        - replacement
        - N
        - delta
        - confidence
        - prop_P
        - mean_sigma
      columns:
        - name: parametro
          title: "Parameter"
          type: text
        - name: N
          title: N
          type: text
        - name: delta
          title: Δ
          type: number
        - name: conf
          title: "Confidence"
          type: text
        - name: z
          title: z (α/2)
          type: number
        - name: input_stat
          title: P / σ
          type: number
        - name: schema
          title: "Scheme"
          type: text

    - name: result
      title: "Sample size"
      type: Table
      rows: 1
      clearWith:
        - param
        - replacement
        - N
        - delta
        - confidence
        - prop_P
        - mean_sigma
      columns:
        - name: n_teorico
          title: "Theoretical n"
          type: number
        - name: n_consigliato
          title: "Recommended n"
          type: integer
        - name: frazione
          title: "Fraction f = n/N"
          type: number
          format: zto
        - name: var_attesa
          title: "Expected estimator variance"
          type: number
        - name: se_attesa
          title: "Expected standard error"
          type: number
...
