---
name: duplicates
title: "Duplicates"
jrs: '1.1'

items:
  - name: instructions
    title: "Instructions"
    type: Html
    visible: (tuto)

  - name: riepilogo
    title: "Summary"
    type: Table
    rows: 1
    clearWith:
      - vars
      - ignoreCase
    columns:
      - name: righe
        title: "Rows compared"
        type: integer
      - name: gruppi
        title: "Groups of identical rows"
        type: integer
      - name: inpiu
        title: "Extra rows"
        type: integer
      - name: vuote
        title: "Rows without data"
        type: integer

  - name: gruppi
    title: "Identical rows"
    type: Table
    rows: 0
    clearWith:
      - vars
      - ignoreCase
    columns:
      - name: gruppo
        title: "Group"
        type: integer
      - name: righe
        title: "Rows"
        type: text
      - name: tenuta
        title: "Row to keep"
        type: integer
      - name: valore
        title: "Value"
        type: text

  - name: duplicatoOV
    title: "Duplicates"
    type: Output
    varTitle: duplicato
    varDescription: 1 = riga ripetuta da escludere, 0 = riga da tenere
    measureType: nominal
    clearWith:
      - vars
      - ignoreCase
...
