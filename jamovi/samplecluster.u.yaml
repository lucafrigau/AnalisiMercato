title: Campionamento a grappoli
name: samplecluster
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    permitted:
      - factor
      - numeric
      - id
    children:
      - type: TargetLayoutBox
        label: Variabile di grappolo
        children:
          - type: VariablesListBox
            name: cluster_var
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Variabile identificativa (opzionale)
        children:
          - type: VariablesListBox
            name: id_var
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: tuto
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: size_mode
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: ng
        format: number
        enable: (size_mode:ng)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: fg
        format: number
        enable: (size_mode:fg)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: seed
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: Output
        name: out_freq
