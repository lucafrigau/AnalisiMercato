authors:
  - Luca Frigau
maintainer: Luca Frigau <frigau@unica.it>
date: '2026-11-19'
type: R
defaultLanguage: en
description: >-
  Teaching and applied module for the Market Analysis course. It provides tools
  for some of the main quantitative phases of market research: sample surveys
  (sample size, sample selection with the main probability designs - simple
  random, systematic, proportional and optimal stratified, cluster, two-stage,
  probability proportional to size - confidence intervals and Design Effect),
  data preparation (dummy variables, duplicates, response quality and
  multivariate outliers), hierarchical cluster analysis (with metrics for
  choosing the number of groups, cluster profiling and comparison of partitions
  through the Adjusted Rand Index) and principal component analysis (with
  varimax/promax rotation, correlation circle, biplot and heatmap of squared
  cosines).

  Bug reports, calculation errors or suggestions: write to Luca Frigau
  (frigau@unica.it) stating the module version, the analysis involved and the
  steps to reproduce the problem.
datasets:
  - name: Customer population
    path: popolazione_clienti.omv
    description: >-
      5,000 customers with area, age, sex, income, annual spending, store and
      loyalty seniority. It is the list from which the sample is drawn with
      every design: the store acts as cluster, the area as stratum.
    tags:
      - Campionamento
  - name: Municipalities by strata
    path: comuni_strati.omv
    description: >-
      200 municipalities with area, population, average income and number of
      stores. For proportional and Neyman allocation and for sampling with
      probability proportional to size.
    tags:
      - Campionamento
  - name: Questionnaire to clean
    path: questionario_grezzo.omv
    description: >-
      154 answers to an online questionnaire as exported by Google Forms, before
      cleaning: double submissions, a multiple-response question, a battery of
      items with all-equal and missing answers, two control questions and an
      unusual combination of income and spending. For the Data preparation
      analyses.
    tags:
      - Preparazione dei dati
  - name: Segmentation survey
    path: survey_segmentazione.omv
    description: >-
      400 respondents, eight items on a 1-7 scale plus age, income, sex and
      area. Base for the cluster analysis and the PCA; the segmento_vero column
      allows the partition obtained to be assessed with the Adjusted Rand Index.
    tags:
      - Cluster Analysis
      - PCA
  - name: Product panel
    path: panel_prodotti.omv
    description: >-
      20 brands described by ten perceived attributes, plus the positioning tier
      as a supplementary qualitative variable. For the positioning map with the
      PCA.
    tags:
      - PCA
