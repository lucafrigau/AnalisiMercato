---
title: Tecniche di Analisi di Mercato
name: AnalisiMercato
version: 2.1.4
jms: '1.0'
authors:
  - Luca Frigau
maintainer: Luca Frigau <frigau@unica.it>
date: '2026-10-28'
type: R
defaultLanguage: it
description: >-
  Modulo didattico e applicativo per il corso di Analisi di Mercato. Comprende
  strumenti per alcune delle principali fasi quantitative di una ricerca di
  mercato: ricerche per campione (numerosità campionaria, estrazione del
  campione con i principali disegni probabilistici - casuale semplice,
  sistematico, stratificato proporzionale e ottimale, a grappoli, a due stadi,
  con probabilità variabili - intervalli di confidenza e Design Effect), per la
  cluster analysis gerarchica (con metriche per la scelta del numero di gruppi,
  caratterizzazione dei cluster e confronto fra partizioni tramite Adjusted Rand
  Index) e per l'analisi delle componenti principali (con rotazione
  varimax/promax, cerchio delle correlazioni, biplot e heatmap dei coseni
  quadrati).

  Segnalazioni di bug, errori di calcolo o suggerimenti: scrivere a Luca Frigau
  (frigau@unica.it) indicando la versione del modulo, l'analisi coinvolta e i
  passi per riprodurre il problema.
datasets:
  - name: Popolazione clienti
    path: popolazione_clienti.omv
    description: >-
      5.000 clienti con area, eta, sesso, reddito, spesa annua, punto vendita e
      anzianita di fedelta. E la lista da cui estrarre il campione con tutti i
      disegni: il punto vendita fa da grappolo, l'area da strato.
    tags:
      - Campionamento
  - name: Comuni per strati
    path: comuni_strati.omv
    description: >-
      200 comuni con area, popolazione, reddito medio e numero di punti vendita.
      Per l'allocazione proporzionale e di Neyman e per il campionamento con
      probabilita proporzionali alla dimensione.
    tags:
      - Campionamento
  - name: Survey di segmentazione
    path: survey_segmentazione.omv
    description: >-
      400 rispondenti, otto item su scala 1-7 piu eta, reddito, sesso e area.
      Base per la cluster analysis e per la PCA; la colonna segmento_vero
      permette di valutare la partizione ottenuta con l'Adjusted Rand Index.
    tags:
      - Cluster Analysis
      - PCA
  - name: Panel di prodotti
    path: panel_prodotti.omv
    description: >-
      20 marche descritte da dieci attributi percepiti, piu la fascia di
      posizionamento come variabile qualitativa supplementare. Per la mappa di
      posizionamento con la PCA.
    tags:
      - PCA
