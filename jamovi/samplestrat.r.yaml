---
name:  samplestrat
title: "Stratified sampling"
jrs:   '1.1'

refs:
    - cochran
    - neyman
    - lohr

items:
    - name: instructions
      title: "Instructions"
      type: Html
      visible: (tuto)

    - name: summary
      title: "Sample summary"
      type: Table
      rows: 1
      clearWith:
        - strat_var
        - aux_var
        - method
        - size_mode
        - n
        - f
        - seed
      columns:
        - name: N
          title: "N (population)"
          type: integer
        - name: M
          title: "M (strata)"
          type: integer
        - name: n_richiesto
          title: "Requested n"
          type: integer
        - name: n_estratto
          title: "Drawn n"
          type: integer
        - name: frazione
          title: "Fraction f = n/N"
          type: number
          format: zto
        - name: metodo
          title: "Method"
          type: text
        - name: seed_used
          title: Seed
          type: integer

    - name: strata
      title: "Allocation by stratum"
      type: Table
      rows: 0
      clearWith:
        - strat_var
        - aux_var
        - method
        - size_mode
        - n
        - f
        - seed
      columns:
        - name: livello
          title: "Stratum"
          type: text
        - name: Nj
          title: N_j
          type: integer
        - name: Wj
          title: W_j
          type: number
          format: zto
        - name: sigma_j
          title: σ_j
          type: number
        - name: nj
          title: n_j
          type: integer
        - name: fj
          title: f_j = n_j / N_j
          type: number
          format: zto

    - name: extracted
      title: "Sampled units"
      type: Table
      rows: 0
      visible: (id_var)
      clearWith:
        - id_var
        - strat_var
        - aux_var
        - method
        - size_mode
        - n
        - f
        - seed
      columns:
        - name: ord
          title: "Order"
          type: integer
        - name: livello
          title: "Stratum"
          type: text
        - name: pos
          title: "Row"
          type: integer
        - name: id_value
          title: ID
          type: text

    - name: out_freq
      title: "Draw the sample (0/1 indicator, frequency)"
      type: Output
      varTitle: in_STpr
      measureType: continuous
      clearWith:
        - strat_var
        - aux_var
        - method
        - size_mode
        - n
        - f
        - seed
...
