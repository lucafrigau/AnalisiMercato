---
name:  samplestrat
title: Campionamento stratificato
jrs:   '1.1'

refs:
    - cochran
    - neyman
    - lohr

items:
    - name: instructions
      title: Istruzioni
      type: Html
      visible: (tuto)

    - name: summary
      title: Riepilogo del campione
      type: Table
      rows: 1
      clearWith:
        - strat_var
        - aux_var
        - method
        - size_mode
        - n
        - f
        - seed
      columns:
        - name: N
          title: N (popolazione)
          type: integer
        - name: M
          title: M (strati)
          type: integer
        - name: n_richiesto
          title: n richiesto
          type: integer
        - name: n_estratto
          title: n estratto
          type: integer
        - name: frazione
          title: Frazione f = n/N
          type: number
          format: zto
        - name: metodo
          title: Metodo
          type: text
        - name: seed_used
          title: Seed
          type: integer

    - name: strata
      title: Allocazione per strato
      type: Table
      rows: 0
      clearWith:
        - strat_var
        - aux_var
        - method
        - size_mode
        - n
        - f
        - seed
      columns:
        - name: livello
          title: Strato
          type: text
        - name: Nj
          title: N_j
          type: integer
        - name: Wj
          title: W_j
          type: number
          format: zto
        - name: sigma_j
          title: σ_j
          type: number
        - name: nj
          title: n_j
          type: integer
        - name: fj
          title: f_j = n_j / N_j
          type: number
          format: zto

    - name: extracted
      title: Unità estratte
      type: Table
      rows: 0
      visible: (id_var)
      clearWith:
        - id_var
        - strat_var
        - aux_var
        - method
        - size_mode
        - n
        - f
        - seed
      columns:
        - name: ord
          title: Ordine
          type: integer
        - name: livello
          title: Strato
          type: text
        - name: pos
          title: Riga
          type: integer
        - name: id_value
          title: ID
          type: text

    - name: out_freq
      title: "Estrai il campione (indicatore 0/1, frequenza)"
      type: Output
      varTitle: in_STpr
      measureType: continuous
      clearWith:
        - strat_var
        - aux_var
        - method
        - size_mode
        - n
        - f
        - seed
...
