---
name:  samplesyst
title: "Systematic sampling"
jrs:   '1.1'

refs:
    - cochran
    - lohr

items:
    - name: instructions
      title: "Instructions"
      type: Html
      visible: (tuto)

    - name: summary
      title: "Sample summary"
      type: Table
      rows: 1
      clearWith:
        - size_mode
        - n
        - f
        - sort_var
        - seed
      columns:
        - name: N
          title: "N (population)"
          type: integer
        - name: n_richiesto
          title: "Requested n"
          type: integer
        - name: n_estratto
          title: "Drawn n"
          type: integer
        - name: intervallo
          title: "Interval k = N/n"
          type: number
          format: zto
        - name: partenza
          title: "Random start r ∈ (0, k]"
          type: number
          format: zto
        - name: ordinato_per
          title: "Sorted by"
          type: text
        - name: seed_used
          title: Seed
          type: integer

    - name: extracted
      title: "Sampled units"
      type: Table
      rows: 0
      visible: (id_var)
      clearWith:
        - id_var
        - sort_var
        - size_mode
        - n
        - f
        - seed
      columns:
        - name: ord
          title: "Order in sample"
          type: integer
        - name: pos
          title: "Position (after sorting)"
          type: integer
        - name: pos_orig
          title: "Original row"
          type: integer
        - name: id_value
          title: ID
          type: text

    - name: out_freq
      title: "Draw the sample (0/1 indicator, frequency)"
      type: Output
      varTitle: in_SM
      measureType: continuous
      clearWith:
        - size_mode
        - n
        - f
        - sort_var
        - seed
...
