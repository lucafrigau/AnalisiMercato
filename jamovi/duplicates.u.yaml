title: "Duplicates"
name: duplicates
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    permitted:
      - factor
      - numeric
      - id
    children:
      - type: TargetLayoutBox
        label: "Variables to compare"
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: tuto
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: ignoreCase
  - type: LayoutBox
    margin: large
    children:
      - type: Output
        name: duplicatoOV
