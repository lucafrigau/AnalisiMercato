title: Numerosità campionaria
name: samplesize
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: tuto
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: param
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: replacement
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: 'N'
        format: number
        enable: (!replacement)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: delta
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: confidence
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: prop_P
        format: number
        enable: (param:proportion)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: mean_sigma
        format: number
        enable: (param:mean)
