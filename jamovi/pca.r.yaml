---
name:  pca
title: "Principal Component Analysis"
jrs:   '1.1'
refs:
    - jolliffe
    - kaiser
    - hendrickson
    - factominer
    - explo

items:
    - name: instructions
      title: "Instructions"
      type: Html
      visible: (tuto)

    - name: settings
      title: "Settings"
      type: Table
      rows: 1
      clearWith:
        - vars
        - standardize
        - ncp
        - rotation
      columns:
        - name: n_var
          title: "Active variables"
          type: integer
        - name: n_obs
          title: "Observations (n)"
          type: integer
        - name: standardize
          title: "Standardized"
          type: text
        - name: ncp_used
          title: "Retained components"
          type: integer
        - name: rotation
          title: "Rotation"
          type: text

    - name: eigenvalues
      title: "Eigenvalues and explained variance"
      type: Table
      rows: 0
      clearWith:
        - vars
        - standardize
        - ncp
        - rotation
      columns:
        - name: comp
          title: "Component"
          type: text
        - name: eig
          title: "Eigenvalue"
          type: number
        - name: var_pct
          title: "% variance"
          type: number
        - name: cum_pct
          title: "% cumulative"
          type: number

    - name: ss_loadings
      title: "Sums of squared loadings after rotation"
      type: Table
      rows: 0
      visible: false
      clearWith:
        - vars
        - standardize
        - ncp
        - rotation
      columns:
        - name: comp
          title: "Rotated component"
          type: text
        - name: ss
          title: SS loadings
          type: number
        - name: ss_pct
          title: "% variance"
          type: number
        - name: ss_cum
          title: "% cumulative"
          type: number

    - name: phi
      title: "Correlations between the rotated components (Φ)"
      type: Table
      rows: 0
      visible: (rotation:promax)
      clearWith:
        - vars
        - standardize
        - ncp
        - rotation
      columns:
        - name: componente
          title: "Component"
          type: text

    - name: var_coord
      title: "Variable coordinates (loadings)"
      type: Table
      rows: 0
      clearWith:
        - vars
        - standardize
        - ncp
        - rotation
      columns:
        - name: variabile
          title: "Variable"
          type: text

    - name: var_contrib
      title: "Variable contributions (%)"
      type: Table
      rows: 0
      clearWith:
        - vars
        - standardize
        - ncp
        - rotation
      columns:
        - name: variabile
          title: "Variable"
          type: text

    - name: var_cos2
      title: "Squared cosines of the variables (cos²)"
      type: Table
      rows: 0
      clearWith:
        - vars
        - standardize
        - ncp
        - rotation
      columns:
        - name: variabile
          title: "Variable"
          type: text

    - name: ind_group
      title: "Observations"
      type: Group
      visible: (show_ind)
      items:
        - name: ind_coord
          title: "Observation coordinates"
          type: Table
          rows: 0
          clearWith:
            - vars
            - standardize
            - ncp
            - rotation
            - top_ind
            - id_var
          columns:
            - name: id
              title: "ID/Row"
              type: text

        - name: ind_contrib
          title: "Observation contributions (%)"
          type: Table
          rows: 0
          clearWith:
            - vars
            - standardize
            - ncp
            - rotation
            - top_ind
            - id_var
          columns:
            - name: id
              title: "ID/Row"
              type: text

        - name: ind_cos2
          title: "Squared cosines of the observations (cos²)"
          type: Table
          rows: 0
          clearWith:
            - vars
            - standardize
            - ncp
            - rotation
            - top_ind
            - id_var
          columns:
            - name: id
              title: "ID/Row"
              type: text

    - name: plot_scree
      title: Scree plot
      type: Image
      width: 500
      height: 400
      renderFun: .plot_scree
      visible: (plot_scree)
      clearWith:
        - vars
        - standardize
        - ncp
        - rotation

    - name: plot_circle
      title: "Correlation circle"
      type: Image
      width: 500
      height: 500
      renderFun: .plot_circle
      visible: (plot_circle)
      clearWith:
        - vars
        - standardize
        - ncp
        - rotation
        - circle_promax
        - supp_quant
        - axis_x
        - axis_y

    - name: plot_biplot
      title: "Biplot of the observations"
      type: Image
      width: 600
      height: 500
      renderFun: .plot_biplot
      visible: (plot_biplot)
      clearWith:
        - vars
        - standardize
        - ncp
        - rotation
        - supp_qual
        - id_var
        - axis_x
        - axis_y

    - name: plot_cos2
      title: "Representation quality (cos²) — heatmap"
      type: Image
      width: 600
      height: 400
      renderFun: .plot_cos2
      visible: (plot_cos2)
      clearWith:
        - vars
        - standardize
        - ncp
        - rotation

    - name: plot_map
      title: "Positioning map"
      type: Image
      width: 800
      height: 650
      renderFun: .plot_map
      visible: (plot_map)
      clearWith:
        - vars
        - standardize
        - ncp
        - supp_quant
        - supp_qual
        - supp_qual_map
        - rotation
        - axis_x
        - axis_y
        - map_show_active
        - map_show_supp_quant
        - map_width
        - map_height

    - name: out_PC1
      title: "PC1"
      type: Output
      varTitle: PC1
      measureType: continuous
      clearWith: [vars, standardize, ncp, rotation]

    - name: out_PC2
      title: "PC2"
      type: Output
      varTitle: PC2
      measureType: continuous
      clearWith: [vars, standardize, ncp, rotation]

    - name: out_PC3
      title: "PC3"
      type: Output
      varTitle: PC3
      measureType: continuous
      clearWith: [vars, standardize, ncp, rotation]

    - name: out_PC4
      title: "PC4"
      type: Output
      varTitle: PC4
      measureType: continuous
      clearWith: [vars, standardize, ncp, rotation]

    - name: out_PC5
      title: "PC5"
      type: Output
      varTitle: PC5
      measureType: continuous
      clearWith: [vars, standardize, ncp, rotation]
...
