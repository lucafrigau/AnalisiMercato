---
name:  samplecluster
title: "Cluster sampling"
jrs:   '1.1'

refs:
    - cochran
    - kish

items:
    - name: instructions
      title: "Instructions"
      type: Html
      visible: (tuto)

    - name: summary
      title: "Sample summary"
      type: Table
      rows: 1
      clearWith:
        - cluster_var
        - size_mode
        - ng
        - fg
        - seed
      columns:
        - name: N
          title: "N (population)"
          type: integer
        - name: M
          title: "M (total clusters)"
          type: integer
        - name: ng_richiesto
          title: "Requested n_g"
          type: integer
        - name: ng_estratto
          title: "Drawn n_g"
          type: integer
        - name: n_unita
          title: "Sampled units (n)"
          type: integer
        - name: frazione_unita
          title: "Fraction f = n/N"
          type: number
          format: zto
        - name: seed_used
          title: Seed
          type: integer

    - name: clusters
      title: "Sampled clusters"
      type: Table
      rows: 0
      clearWith:
        - cluster_var
        - size_mode
        - ng
        - fg
        - seed
      columns:
        - name: grappolo
          title: "Cluster ID"
          type: text
        - name: dim
          title: "Size (n units)"
          type: integer

    - name: extracted
      title: "Sampled units"
      type: Table
      rows: 0
      visible: (id_var)
      clearWith:
        - id_var
        - cluster_var
        - size_mode
        - ng
        - fg
        - seed
      columns:
        - name: ord
          title: "Order"
          type: integer
        - name: grappolo
          title: "Cluster ID"
          type: text
        - name: pos
          title: "Row"
          type: integer
        - name: id_value
          title: ID
          type: text

    - name: out_freq
      title: "Draw the sample (0/1 indicator, frequency)"
      type: Output
      varTitle: in_GR
      measureType: continuous
      clearWith:
        - cluster_var
        - size_mode
        - ng
        - fg
        - seed
...
