---
name:  deff
title: Design Effect
menuGroup: AnalisiMercato
menuSubgroup: "Sampling"
version: '2.0.9'
jas: '1.2'

options:
    - name: tuto
      title: "Show methodological description"
      type: Bool
      default: true

    - name: mode
      title: "Calculation mode"
      type: List
      options:
        - title: "From two variances"
          name:  variances
        - title: "Analytical formula for a specific plan"
          name:  formula
      default: variances
      description:
          R: >
            'variances': inserire la varianza dello stimatore nel piano
            complesso e nel SCR di riferimento, il modulo calcola Deff
            come rapporto. 'formula': usa una formula analitica per uno
            dei piani standard (sistematico, a più stadi, a grappoli,
            stratificato) coerenti con la slide 39.

    # --- modalità 'variances' ---
    - name: var_complex
      title: "Variance in complex design"
      type: Number
      default: 1

    - name: var_srs
      title: "Variance in reference SRS"
      type: Number
      default: 1

    # --- modalità 'formula' ---
    - name: plan
      title: "Sampling plan"
      type: List
      options:
        - title: "Systematic"
          name:  systematic
        - title: "Multistage"
          name:  multistage
        - title: "Clusters"
          name:  cluster
        - title: "Stratified"
          name:  stratified
      default: systematic
      description:
          R: Piano di campionamento per cui calcolare il Deff teorico.

    # parametri per i piani analitici
    - name: N
      title: "Population N (systematic)"
      type: Integer
      default: 1000

    - name: n_total
      title: "Total sample size n"
      type: Integer
      default: 100

    - name: rho
      title: "Intra-cluster correlation (multistage / clusters)"
      type: Number
      default: 0.1

    - name: n_within
      title: "Units per group / cluster size (n_s or n_g)"
      type: Integer
      default: 10

    - name: L
      title: "Number of strata L (stratified)"
      type: Integer
      default: 4

    - name: R2
      title: "R² between target and stratification variable"
      type: Number
      default: 0.3

    # --- numerosità SCR equivalente (output) ---
    - name: n_srs
      title: "Reference sample size (n)"
      type: Integer
      default: 100
      description:
          R: >
            Numerosità n, letta in due modi: se è la numerosità del casuale
            semplice da eguagliare, il piano complesso ne richiede
            n_complex = Deff · n; se è un campione già raccolto col piano
            complesso, vale quanto n_eff = n / Deff unità di un casuale semplice.
...
