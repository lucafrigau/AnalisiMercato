---
name: dummies
title: "Dummy variables"
jrs: '1.1'

items:
  - name: instructions
    title: "Instructions"
    type: Html
    visible: (tuto)

  - name: dummies
    title: "Dummies created"
    type: Table
    rows: 0
    clearWith:
      - vars
      - multi
      - sep
      - minAltro
    columns:
      - name: var
        title: "Variable"
        type: text
        combineBelow: true
      - name: level
        title: "Level"
        type: text
      - name: name
        title: "Dummy name"
        type: text
      - name: n1
        title: "N with 1"
        type: integer
      - name: perc1
        title: "% with 1"
        type: number
        format: pc
      - name: nmiss
        title: "Missing"
        type: integer

  - name: dummiesOV
    title: "Dummy variables"
    type: Output
    initInRun: true
    measureType: continuous
    clearWith:
      - vars
      - multi
      - sep
      - minAltro
...
