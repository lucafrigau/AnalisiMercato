---
name:  sampleppv
title: "Probability-proportional-to-size (PPS) sampling"
jrs:   '1.1'

refs:
    - hansenhurwitz
    - cochran

items:
    - name: instructions
      title: "Instructions"
      type: Html
      visible: (tuto)

    - name: summary
      title: "Sample summary"
      type: Table
      rows: 1
      clearWith:
        - weight_var
        - replacement
        - size_mode
        - n
        - f
        - seed
      columns:
        - name: N
          title: "N (population)"
          type: integer
        - name: n_richiesto
          title: "Requested n"
          type: integer
        - name: n_distinti
          title: "Distinct units (n)"
          type: integer
        - name: n_totale
          title: "Total draws"
          type: integer
        - name: peso_totale
          title: "Σ weights"
          type: number
        - name: schema
          title: "Scheme"
          type: text
        - name: seed_used
          title: Seed
          type: integer

    - name: extracted
      title: "Sampled units"
      type: Table
      rows: 0
      visible: (id_var)
      clearWith:
        - id_var
        - weight_var
        - replacement
        - size_mode
        - n
        - f
        - seed
      columns:
        - name: pos
          title: "Row"
          type: integer
        - name: id_value
          title: ID
          type: text
        - name: peso
          title: "Weight w_i"
          type: number
        - name: prob
          title: "Selection prob. p_i = w_i/Σw"
          type: number
          format: zto
        - name: pi_incl
          title: "Inclusion prob. π_i"
          type: number
          format: zto
        - name: freq
          title: "Draw frequency"
          type: integer

    - name: out_freq
      title: "Draw the sample (frequency in the sample)"
      type: Output
      varTitle: freq_CPV
      measureType: continuous
      clearWith:
        - weight_var
        - replacement
        - size_mode
        - n
        - f
        - seed
...
