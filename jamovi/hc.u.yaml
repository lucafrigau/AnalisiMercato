title: Cluster Analysis Gerarchica
name: hc
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Base della segmentazione
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Binarie di presenza/assenza
        children:
          - type: VariablesListBox
            name: asimm
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: tuto
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: dis
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: method
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: stdVars
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: n_clusters
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: outputName
        format: string
  - type: LayoutBox
    margin: large
    children:
      - type: Output
        name: label_cluster
      - type: CheckBox
        name: dend
      - type: CheckBox
        name: r2
      - type: CheckBox
        name: rmsstd
      - type: CheckBox
        name: deltaG
      - type: CheckBox
        name: ch_index
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: width_dend
        format: number
        enable: (dend)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: height_dend
        format: number
        enable: (dend)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: width_r2
        format: number
        enable: (r2)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: height_r2
        format: number
        enable: (r2)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: width_rmsstd
        format: number
        enable: (rmsstd)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: height_rmsstd
        format: number
        enable: (rmsstd)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: width_deltaG
        format: number
        enable: (deltaG)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: height_deltaG
        format: number
        enable: (deltaG)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: width_ch
        format: number
        enable: (ch_index)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: height_ch
        format: number
        enable: (ch_index)
