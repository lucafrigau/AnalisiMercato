---
name:  hc
title: "Hierarchical Cluster Analysis"
menuGroup: AnalisiMercato
menuSubgroup: Cluster Analysis
version: '2.1.2'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: vars
      title: "Segmentation base"
      type: Variables
      rejectInf: true
      permitted:
         - numeric
         - factor
      description:
          R: >
            Variabili su cui calcolare la matrice delle distanze e
            applicare l'algoritmo di clustering gerarchico. Sono ammesse
            variabili quantitative e categoriali: Gower è la metrica
            adatta ai dataset misti, Sokal-Michener e Jaccard
            (politomici) trattano le modalità come categorie, mentre
            Euclidea, Manhattan e Mahalanobis trattano i valori come
            quantità (ammesse anche su categoriali con modalità
            numeriche, ma i codici entrano nel calcolo come numeri).

    - name: asimm
      title: "Presence/absence binaries"
      type: Variables
      default: []
      rejectInf: true
      permitted:
         - numeric
         - factor
      description:
          R: >
            Variabili binarie di presenza/assenza, con valori 0 e 1 (0 =
            assenza, 1 = presenza): numeriche o fattori con livelli "0" e
            "1"; le modalità testuali sono rifiutate. Entrano nella base
            della segmentazione insieme a quelle di `vars`. Con la
            distanza di Gower la co-assenza (0 in entrambe le unità) non
            entra nel confronto: per quella coppia la variabile esce dalla
            media, come nell'indice di Jaccard. Una variabile a due
            modalità entrambe informative (per esempio il sesso) va invece
            in `vars`. Con le altre distanze queste variabili sono
            trattate come quelle di `vars`; nell'interfaccia di jamovi la
            casella è attiva solo con Gower, e cambiando distanza le sue
            variabili passano in `vars`.

    - name: tuto
      title: "Show methodological description"
      type: Bool
      default: true
      description:
          R: >
            Se TRUE mostra il pannello con la descrizione metodologica
            dell'analisi.

    - name: dis
      title: "Distance"
      type: List
      options:
        - title: "Euclidean"
          name:  euclidean
        - title: Manhattan
          name:  manhattan
        - title: Mahalanobis
          name:  mahalanobis
        - title: Sokal-Michener
          name:  SokalMichener
        - title: Gower
          name:  gower
        - title: Jaccard
          name:  binary
        - title: "Jaccard (polytomous)"
          name:  politomici
      default: euclidean
      description:
          R: >
            Metrica di distanza fra osservazioni. In tutte le metriche di
            matching il valore 0 significa "assenza", sia che la variabile
            sia numerica sia che sia un fattore con livelli numerici.
            'euclidean'/'manhattan'/'mahalanobis' trattano i valori come
            quantità (una variabile categoriale con modalità numeriche è
            ammessa, ma i codici entrano nel calcolo come numeri);
            'binary' (Jaccard) richiede variabili a due modalità
            codificate 0/1; 'SokalMichener' è il simple matching, valido
            anche con più modalità; 'politomici' è il Jaccard per
            variabili categoriali con più modalità; 'gower' è l'unica
            metrica adatta ai dataset MISTI quantitativi + qualitativi
            (normalizza ogni variabile quantitativa per il proprio range,
            usa il simple matching per quelle categoriali ed esclude la
            co-assenza per le binarie di presenza/assenza di `asimm`; la
            standardizzazione esplicita non ha effetto perché già inclusa
            nella definizione).

    - name: method
      title: "Agglomeration method"
      type: List
      options:
        - title: Ward
          name:  ward.D2
        - title: "Single linkage"
          name:  single
        - title: "Complete linkage"
          name:  complete
        - title: "Average linkage"
          name:  average
        - title: "Centroid"
          name:  centroid
      default: ward.D2
      description:
          R: >
            Criterio di agglomerazione passato a stats::hclust. Ward
            (ward.D2) è la scelta più comune per dati quantitativi
            standardizzati.

    - name: stdVars
      title: "Standardize variables"
      type: Bool
      default: true
      description:
          R: >
            Se TRUE standardizza le variabili prima del calcolo della
            distanza. Applicato solo a distanze numeriche (Euclidea,
            Manhattan, Mahalanobis); ignorato per distanze binarie/categoriche.

    - name: n_clusters
      title: "Number of groups"
      type: Integer
      default: 2
      description:
          R: >
            Numero di cluster k a cui tagliare il dendrogramma per produrre
            l'assegnazione delle osservazioni.

    - name: outputName
      title: "Output variable name"
      type: String
      default: "Cluster"
      description:
          R: >
            Nome della colonna che jamovi inietterà nel dataset con
            l'assegnazione di ciascuna osservazione al proprio cluster.

    - name: label_cluster
      title: "Cluster label"
      type: Output
      description:
          R: Colonna di output con l'assegnazione di ogni osservazione al cluster.

    - name: dend
      title: "Dendrogram"
      type: Bool
      default: false
      description:
          R: Se TRUE produce il dendrogramma colorato per cluster.

    - name: r2
      title: R²
      type: Bool
      default: false
      description:
          R: Se TRUE produce il grafico dell'R² al variare di k.

    - name: rmsstd
      title: RMSSTD
      type: Bool
      default: false
      description:
          R: Se TRUE produce il grafico dell'RMSSTD al variare di k.

    - name: deltaG
      title: Delta G
      type: Bool
      default: false
      description:
          R: >
            Se TRUE produce il grafico del Delta G (differenza fra altezze
            di unione successive) al variare di k.

    - name: ch_index
      title: "CH index"
      type: Bool
      default: false
      description:
          R: >
            Se TRUE produce il grafico dell'Indice F di Calinski-Harabasz
            al variare di k.

    # Dimensioni dei grafici. Raggruppate in CollapseBox nella UI (hc.u.yaml).
    - name: width_dend
      type: Integer
      title: "Dendrogram width"
      default: 500

    - name: height_dend
      type: Integer
      title: "Dendrogram height"
      default: 500

    - name: width_r2
      type: Integer
      title: "R² plot width"
      default: 500

    - name: height_r2
      type: Integer
      title: "R² plot height"
      default: 500

    - name: width_rmsstd
      type: Integer
      title: "RMSSTD plot width"
      default: 500

    - name: height_rmsstd
      type: Integer
      title: "RMSSTD plot height"
      default: 500

    - name: width_deltaG
      type: Integer
      title: "Delta G plot width"
      default: 500

    - name: height_deltaG
      type: Integer
      title: "Delta G plot height"
      default: 500

    - name: width_ch
      type: Integer
      title: "CH index plot width"
      default: 500

    - name: height_ch
      type: Integer
      title: "CH index plot height"
      default: 500
...
