---
name:  pca
title: "Principal Component Analysis"
menuGroup: AnalisiMercato
menuSubgroup: PCA
version: '2.0.9'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: vars
      title: "Active variables (quantitative)"
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: >
            Variabili quantitative usate per costruire le componenti
            principali. Devono essere almeno due. La PCA opera sulla
            matrice di covarianza (se non standardizzate) o di correlazione
            (se standardizzate).

    - name: supp_quant
      title: "Supplementary quantitative variables (optional)"
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: >
            Variabili quantitative che NON contribuiscono al calcolo delle
            componenti, ma vengono proiettate a posteriori nel piano
            principale. Utili per validare le componenti con variabili
            esterne.

    - name: supp_qual
      title: "Supplementary qualitative variable for biplot (optional)"
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      description:
          R: >
            Variabile categoriale che NON contribuisce al calcolo delle
            componenti. Usata SOLO per colorare le osservazioni nel biplot.

    - name: supp_qual_map
      title: "Qualitative variables for positioning map (optional)"
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      description:
          R: >
            Una o più variabili categoriali supplementari. I baricentri
            delle loro modalità vengono proiettati nel piano principale e
            disegnati nel grafico "Mappa di posizionamento".

    - name: id_var
      title: "ID variable (optional)"
      type: Variable
      suggested:
        - id
        - nominal
        - ordinal
      permitted:
        - factor
        - id
        - numeric
      description:
          R: >
            Variabile usata per etichettare le osservazioni nelle tabelle
            e nel biplot.

    - name: tuto
      title: "Show analysis description"
      type: Bool
      default: true

    - name: standardize
      title: "Standardize variables (z-score)"
      type: Bool
      default: true
      description:
          R: >
            Se TRUE applica la PCA sulla matrice di correlazione (z-score
            preventivo). Raccomandato quando le variabili hanno unità di
            misura o varianze diverse. Se FALSE applica la PCA sulla
            matrice di covarianza.

    - name: ncp
      title: "Number of components to retain"
      type: Integer
      default: 2
      description:
          R: >
            Numero di componenti principali da ritenere (massimo 5). Per
            orientarsi sulla scelta, consultare la tabella degli
            autovalori e lo scree plot (criterio di Kaiser: λ > 1;
            criterio del gomito; criterio della varianza cumulata).

    - name: rotation
      title: "Rotation"
      type: List
      options:
        - title: "None"
          name:  none
        - title: "Varimax (orthogonal)"
          name:  varimax
        - title: "Promax (oblique)"
          name:  promax
      default: none
      description:
          R: >
            Rotazione applicata ai loadings per facilitare l'interpretazione
            delle componenti. Varimax (ortogonale) massimizza la varianza
            dei loadings al quadrato per ciascuna componente; Promax
            (obliqua) consente che le componenti ruotate siano correlate.

    # --- output / plot ---
    - name: show_ind
      title: "Show observation contributions/cos² tables"
      type: Bool
      default: false

    - name: top_ind
      title: "Maximum number of observations to display"
      type: Integer
      default: 20

    - name: axis_x
      title: "Component on X axis"
      type: Integer
      default: 1
      description:
          R: >
            Componente da visualizzare sull'asse orizzontale del cerchio
            delle correlazioni e del biplot (es. 1 = PC1).

    - name: axis_y
      title: "Component on Y axis"
      type: Integer
      default: 2
      description:
          R: >
            Componente da visualizzare sull'asse verticale del cerchio
            delle correlazioni e del biplot (es. 2 = PC2).

    - name: plot_scree
      title: Scree plot
      type: Bool
      default: true

    - name: plot_circle
      title: "Correlation circle (variables)"
      type: Bool
      default: true

    - name: circle_promax
      title: "▸ CIRCLE · With Promax"
      type: List
      options:
        - title: "Oblique axes over unrotated arrows"
          name:  oblique
        - title: "Perpendicular axes, pattern loadings"
          name:  pattern
      default: oblique
      description:
          R: >
            Come disegnare il cerchio delle correlazioni con la rotazione
            Promax. `oblique` (predefinito): le frecce restano quelle senza
            rotazione e le componenti di Promax sono due assi obliqui, il
            coseno del cui angolo è la loro correlazione; una freccia
            proiettata ad angolo retto su un asse dà la correlazione con
            quella componente. `pattern`: assi perpendicolari e frecce con
            coordinate uguali ai pattern loadings della tabella.

    - name: plot_biplot
      title: "Biplot (observations on principal plane)"
      type: Bool
      default: true

    - name: plot_cos2
      title: "Heatmap of squared cosines (representation quality)"
      type: Bool
      default: true

    - name: plot_map
      title: "Positioning map (variables and centroids, no observations)"
      type: Bool
      default: false
      description:
          R: >
            Plot delle sole variabili: baricentri delle modalità della
            variabile qualitativa supplementare + (opzionalmente) vettori
            delle attive e/o delle quantitative supplementari. Utile per
            leggere il posizionamento di segmenti o marche rispetto agli
            attributi.

    - name: map_show_active
      title: "▸ MAP · Show active variables arrows"
      type: Bool
      default: false
      description:
          R: Se TRUE aggiunge le frecce delle variabili attive alla mappa.

    - name: map_show_supp_quant
      title: "▸ MAP · Show supplementary quantitative arrows"
      type: Bool
      default: true
      description:
          R: >
            Se TRUE aggiunge le frecce delle variabili quantitative
            supplementari (se presenti) alla mappa.

    - name: map_width
      title: "▸ MAP · Width"
      type: Integer
      default: 800

    - name: map_height
      title: "▸ MAP · Height"
      type: Integer
      default: 650

    - name: out_PC1
      title: "▸ SAVE · PC1"
      type: Output
    - name: out_PC2
      title: "▸ SAVE · PC2"
      type: Output
    - name: out_PC3
      title: "▸ SAVE · PC3"
      type: Output
    - name: out_PC4
      title: "▸ SAVE · PC4"
      type: Output
    - name: out_PC5
      title: "▸ SAVE · PC5"
      type: Output
...
