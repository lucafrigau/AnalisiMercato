title: "Response quality"
name: respquality
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: "Item battery (same scale)"
        children:
          - type: VariablesListBox
            name: items
            isTarget: true
      - type: TargetLayoutBox
        label: "Pairs of control questions"
        children:
          - type: VariablesListBox
            name: pairs
            isTarget: true
            fullRowSelect: true
            itemDropBehaviour: overwrite
            columns:
              - name: i1
                stretchFactor: 1
                template:
                  type: VariableLabel
              - name: i2
                stretchFactor: 1
                template:
                  type: VariableLabel
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: tuto
  - type: Label
    label: "Signals from the item battery"
    children:
      - type: TextBox
        name: seqPerc
        format: number
        suffix: "% of the items"
      - type: TextBox
        name: missPerc
        format: number
        suffix: "% of the items"
  - type: Label
    label: "Signals from the control questions"
    children:
      - type: TextBox
        name: distMin
        format: number
  - type: Label
    label: "Respondents to examine"
    children:
      - type: TextBox
        name: minSegnali
        format: number
        suffix: "signals"
  - type: LayoutBox
    margin: large
    children:
      - type: Output
        name: segnaliOV
      - type: Output
        name: indicatoriOV
