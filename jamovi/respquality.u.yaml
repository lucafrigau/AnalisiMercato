title: Qualità delle risposte
name: respquality
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Batteria di item (stessa scala)
        children:
          - type: VariablesListBox
            name: items
            isTarget: true
      - type: TargetLayoutBox
        label: Coppie di domande di controllo
        children:
          - type: VariablesListBox
            name: pairs
            isTarget: true
            fullRowSelect: true
            itemDropBehaviour: overwrite
            columns:
              - name: i1
                stretchFactor: 1
                template:
                  type: VariableLabel
              - name: i2
                stretchFactor: 1
                template:
                  type: VariableLabel
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: tuto
  - type: Label
    label: Segnali della batteria di item
    children:
      - type: TextBox
        name: seqPerc
        format: number
        suffix: '% degli item'
      - type: TextBox
        name: missPerc
        format: number
        suffix: '% degli item'
  - type: Label
    label: Segnali delle domande di controllo
    children:
      - type: TextBox
        name: distMin
        format: number
  - type: Label
    label: Rispondenti da esaminare
    children:
      - type: TextBox
        name: minSegnali
        format: number
        suffix: segnali
  - type: LayoutBox
    margin: large
    children:
      - type: Output
        name: segnaliOV
      - type: Output
        name: indicatoriOV
