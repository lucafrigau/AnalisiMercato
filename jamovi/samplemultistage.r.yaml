---
name:  samplemultistage
title: "Two-stage sampling"
jrs:   '1.1'

refs:
    - cochran
    - kish

items:
    - name: instructions
      title: "Instructions"
      type: Html
      visible: (tuto)

    - name: summary
      title: "Sample summary"
      type: Table
      rows: 1
      clearWith:
        - psu_var
        - psu_mode
        - ng
        - fg
        - ssu_mode
        - b
        - fb
        - seed
      columns:
        - name: N
          title: "N (population)"
          type: integer
        - name: M
          title: "M (total PSUs)"
          type: integer
        - name: ng_richiesto
          title: "Requested n_g"
          type: integer
        - name: ng_estratto
          title: "Drawn n_g"
          type: integer
        - name: ssu_label
          title: "2nd stage"
          type: text
        - name: n_unita
          title: "Sampled units (n)"
          type: integer
        - name: frazione
          title: "Fraction f = n/N"
          type: number
          format: zto
        - name: seed_used
          title: Seed
          type: integer

    - name: psu_table
      title: "Sampled PSUs"
      type: Table
      rows: 0
      clearWith:
        - psu_var
        - psu_mode
        - ng
        - fg
        - ssu_mode
        - b
        - fb
        - seed
      columns:
        - name: psu
          title: PSU
          type: text
        - name: dim_psu
          title: "PSU size"
          type: integer
        - name: n_estratte
          title: "Sampled units"
          type: integer
        - name: f_psu
          title: f_j = n_j / N_j
          type: number
          format: zto

    - name: extracted
      title: "Sampled units"
      type: Table
      rows: 0
      visible: (id_var)
      clearWith:
        - id_var
        - psu_var
        - psu_mode
        - ng
        - fg
        - ssu_mode
        - b
        - fb
        - seed
      columns:
        - name: ord
          title: "Order"
          type: integer
        - name: psu
          title: PSU
          type: text
        - name: pos
          title: "Row"
          type: integer
        - name: id_value
          title: ID
          type: text

    - name: out_freq
      title: "Draw the sample (0/1 indicator, frequency)"
      type: Output
      varTitle: in_2STG
      measureType: continuous
      clearWith:
        - psu_var
        - psu_mode
        - ng
        - fg
        - ssu_mode
        - b
        - fb
        - seed
...
