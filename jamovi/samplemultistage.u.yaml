title: Campionamento a due stadi
name: samplemultistage
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    permitted:
      - factor
      - numeric
      - id
    children:
      - type: TargetLayoutBox
        label: Variabile unità di primo stadio (PSU)
        children:
          - type: VariablesListBox
            name: psu_var
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Variabile identificativa (opzionale)
        children:
          - type: VariablesListBox
            name: id_var
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: tuto
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: psu_mode
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: ng
        format: number
        enable: (psu_mode:ng)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: fg
        format: number
        enable: (psu_mode:fg)
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: ssu_mode
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: b
        format: number
        enable: (ssu_mode:fixed)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: fb
        format: number
        enable: (ssu_mode:frac)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: seed
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: Output
        name: out_freq
