title: Caratterizzazione
name: catdes
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variabile 'Cluster' da caratterizzare
        children:
          - type: VariablesListBox
            name: vartochar
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Descrittori
        children:
          - type: VariablesListBox
            name: descbyvar
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: tuto
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: threshold
        format: number
