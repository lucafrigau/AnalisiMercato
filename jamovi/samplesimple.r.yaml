---
name:  samplesimple
title: "Simple random sampling"
jrs:   '1.1'

refs:
    - cochran
    - lohr

items:
    - name: instructions
      title: "Instructions"
      type: Html
      visible: (tuto)

    - name: summary
      title: "Sample summary"
      type: Table
      rows: 1
      clearWith:
        - size_mode
        - n
        - f
        - replacement
        - seed
      columns:
        - name: N
          title: "N (population)"
          type: integer
        - name: n_richiesto
          title: "Requested n"
          type: integer
        - name: n_distinti
          title: "Distinct units (n)"
          type: integer
        - name: n_totale
          title: "Total draws"
          type: integer
        - name: frazione
          title: "Fraction f = n/N"
          type: number
          format: zto
        - name: schema
          title: "Scheme"
          type: text
        - name: seed_used
          title: Seed
          type: integer

    - name: extracted
      title: "Sampled units"
      type: Table
      rows: 0
      visible: (id_var)
      clearWith:
        - id_var
        - size_mode
        - n
        - f
        - replacement
        - seed
      columns:
        - name: pos
          title: "Position"
          type: integer
        - name: id_value
          title: ID
          type: text
        - name: freq
          title: "Draw frequency"
          type: integer

    - name: out_freq
      title: "Draw the sample (frequency in the sample)"
      type: Output
      varTitle: freq_SSR
      measureType: continuous
      clearWith:
        - size_mode
        - n
        - f
        - replacement
        - seed
...
