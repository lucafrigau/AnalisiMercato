---
name:  confint
title: "Confidence intervals"
menuGroup: AnalisiMercato
menuSubgroup: "Sampling"
version: '2.0.9'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: data_var
      title: "Variable (for dataset-based estimation)"
      type: Variable
      suggested:
        - continuous
        - nominal
      permitted:
        - factor
        - id
        - numeric
      description:
          R: >
            Se specificata, l'IC viene calcolato direttamente dai dati di
            questa variabile (media se numerica, proporzione del livello
            di riferimento se factor binario).

    - name: success_level
      title: "\"Success\" level (for categorical variable)"
      type: String
      default: ""
      description:
          R: >
            Per una variabile categoriale, etichetta del livello considerato
            "successo" (numeratore della proporzione). Se vuoto, viene usato
            il primo livello.

    - name: tuto
      title: "Show methodological description"
      type: Bool
      default: true

    - name: param
      title: "Parameter to estimate (manual mode)"
      type: List
      options:
        - title: "Proportion"
          name:  proportion
        - title: "Mean"
          name:  mean
      default: proportion
      description:
          R: Solo per la modalità manuale (senza variabile selezionata).

    - name: n_manual
      title: "Sample size n"
      type: Integer
      default: 100
      description:
          R: >
            Numerosità del campione in modalità manuale. Il minimo è 2:
            con n = 1 la varianza campionaria non è definita (né per la
            media né per la proporzione) e il backend rifiuterebbe
            comunque il calcolo.

    - name: p_manual
      title: "Sample proportion p_c (proportion mode)"
      type: Number
      default: 0.5

    - name: mean_manual
      title: "Sample mean x̄ (mean mode)"
      type: Number
      default: 0

    - name: sd_manual
      title: "Sample standard deviation s (mean mode)"
      type: Number
      default: 1

    - name: N
      title: "Population size N (optional)"
      type: Integer
      default: 1000
      description:
          R: >
            Se fornita, l'IC include il fattore correttivo per popolazioni
            finite (1 - f). Mantenere N molto grande (o ignorare) per il
            caso "popolazione infinita".

    - name: use_fpc
      title: "Apply finite population correction (1 - f)"
      type: Bool
      default: false
      description:
          R: >
            Se TRUE applica (1 - f) all'espressione della varianza dello
            stimatore (slide 14, 20, 23). Disattivato per default: la
            correzione va abilitata consapevolmente, dichiarando la N
            effettiva della popolazione. Con il default attivo uno
            studente otterrebbe un IC corretto per una popolazione di
            1000 unità senza averlo mai richiesto (e con n = 1000
            l'errore standard si annullerebbe).

    - name: confidence
      title: "Confidence level (%)"
      type: Number
      default: 95
...
