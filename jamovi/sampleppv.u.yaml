title: Campionamento con probabilità variabili (CPV)
name: sampleppv
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    permitted:
      - factor
      - numeric
      - id
    children:
      - type: TargetLayoutBox
        label: Variabile di peso (ausiliaria)
        children:
          - type: VariablesListBox
            name: weight_var
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Variabile identificativa (opzionale)
        children:
          - type: VariablesListBox
            name: id_var
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: tuto
      - type: CheckBox
        name: replacement
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: size_mode
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: 'n'
        format: number
        enable: (size_mode:n)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: f
        format: number
        enable: (size_mode:f)
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: seed
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: Output
        name: out_freq
